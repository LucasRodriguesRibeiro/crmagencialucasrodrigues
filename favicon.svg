<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Gold Rounded Box -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#goldGrad)" filter="url(#subtleGlow)"/>

  <!-- Subtle inner bevel highlight -->
  <rect x="5" y="5" width="54" height="54" rx="13" ry="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Monogram ALR Text -->
  <text 
    x="32" 
    y="34" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="20" 
    font-weight="900" 
    letter-spacing="1.2" 
    fill="#0B0C10"
  >ALR</text>
</svg>
